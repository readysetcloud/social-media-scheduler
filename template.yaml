AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless Social Post Scheduler - Schedule and Track Social Media Posts with Events

Parameters:
  LinkedInClientId:
    Type: String
    Default: ''
    NoEcho: true
  LinkedInClientSecret:
    Type: String
    Default: ''
    NoEcho: true
  DiscordToken:
    Type: String
    Default: ''
    NoEcho: true
  HmacSecret:
    Type: String
    Default: ''
    NoEcho: true
  BaseUrl:
    Type: String
    Default: ''
  MomentoApiKey:
    Type: String
    Default: ''
  CacheName:
    Type: String
    Default: readysetcloud
  GoogleClientId:
    Type: String
    Default: ''
  GoogleClientSecret:
    Type: String
    Default: ''
  Origin:
    Type: String
    Default: http://localhost:5173

Metadata:
  esbuild-properties: &esbuild-properties
    Format: esm
    Minify: true
    OutExtension:
      - .js=.mjs
    Target: es2020
    Sourcemap: false
    EntryPoints:
      - index.mjs
    Banner:
      - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    External:
      - '@aws-sdk/*'
    Loader:
      - .hbs=text
      - .handlebars=text

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Tracing: Active
    Timeout: 15
    MemorySize: 1024
    CodeUri: functions
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
        ORIGIN: !Ref Origin
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,Idempotency-Key'"
      AllowOrigin: !Sub "'${Origin}'"
      AllowCredentials: true

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      Auth:
        Authorizers:
          CognitoAuth:
            AuthorizationScopes:
              - email
              - openid
              - profile
            UserPoolArn: !GetAtt CognitoUserPool.Arn
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
      DefinitionBody:
        'Fn::Transform':
          Name: AWS::Include
          Parameters:
            Location: ./openapi.yaml

  PublicApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: public
      DefinitionBody:
        'Fn::Transform':
          Name: AWS::Include
          Parameters:
            Location: ./public-openapi.yaml

  PostScheduleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: type
          AttributeType: S
        - AttributeName: sort
          AttributeType: S
        - AttributeName: campaign
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: schedules
          KeySchema:
            - AttributeName: type
              KeyType: HASH
            - AttributeName: sort
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: campaigns
          KeySchema:
            - AttributeName: campaign
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  LinkedInSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      SecretString:
        Fn::Sub:
          - |-
            {
              "discord": "${discordToken}"
            }
          - discordToken: !Ref DiscordToken

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: SocialMediaUserPool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  FreeMembershipGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      Description: Free membership. Default group for new users
      GroupName: SocialMediaFree
      UserPoolId: !Ref CognitoUserPool
      Precedence: 10

  ProMembershipGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      Description: Pro membership. Includes AI-powered features
      GroupName: SocialMediaPro
      UserPoolId: !Ref CognitoUserPool
      Precedence: 5

  # AuthCertificate:
  #   Type: AWS::CertificateManager::Certificate
  #   Properties:
  #     DomainName: !Sub auth.${RootDomainName}
  #     ValidationMethod: DNS
  #     DomainValidationOptions:
  #       - DomainName: !Sub auth.${RootDomainName}
  #         HostedZoneId: !Ref HostedZoneId

  # CognitoUserPoolDomain:
  #   Type: AWS::Cognito::UserPoolDomain
  #   Properties:
  #     UserPoolId: !Ref CognitoUserPool
  #     Domain: !Sub auth.${RootDomainName}
  #     CustomDomainConfig:
  #       CertificateArn: !Ref AuthCertificate

  # CustomDomainDnsRecord:
  #   Type: AWS::Route53::RecordSet
  #   Properties:
  #     HostedZoneId: !Ref HostedZoneId
  #     Name: !Sub auth.${RootDomainName}
  #     ResourceRecords:
  #       - !GetAtt CognitoUserPoolDomain.CloudFrontDistribution
  #     TTL: 300
  #     Type: CNAME

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Domain: social-butterfly-auth

  CognitoUserPoolIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "email openid profile"
      AttributeMapping:
        email: 'http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress'
        given_name: 'http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname'
        family_name: 'http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname'

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - CognitoUserPoolIdentityProvider
    Properties:
      ClientName: SocialMediaUserPoolClient
      UserPoolId: !Ref CognitoUserPool
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - http://localhost:5173
        - http://localhost:5173/oauth2/idpresponse
      LogoutURLs:
        - http://localhost:5173/logout
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - Google
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: SocialMediaIdentityPool
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !Sub cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}

  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: 'Allow'
          Principal:
            Federated: 'cognito-identity.amazonaws.com'
          Action: 'sts:AssumeRoleWithWebIdentity'
          Condition:
            StringEquals:
              'cognito-identity.amazonaws.com:aud': !Ref CognitoIdentityPool
            'ForAnyValue:StringLike':
              'cognito-identity.amazonaws.com:amr': authenticated
      Policies:
      - PolicyName: CognitoAuthorizedPolicy
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action: execute-api:Invoke
            Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/v1/*/*

  CognitoIdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn

  RegisterPostConfirmationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - register-post-confirmation.mjs
    Properties:
      Handler: register-post-confirmation.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PostScheduleTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
          DEFAULT_GROUP_NAME: SocialMediaFree
      Events:
        Cognito:
          Type: Cognito
          Properties:
            Trigger: PostConfirmation
            UserPool: !Ref CognitoUserPool

  EnrichUserClaimsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - event-handlers/enrich-user-claims.mjs
    Properties:
      Handler: event-handlers/enrich-user-claims.handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          CACHE_NAME: !Ref CacheName
          MOMENTO_API_KEY: !Ref MomentoApiKey
      Events:
        Cognito:
          Type: Cognito
          Properties:
            Trigger: PreTokenGeneration
            UserPool: !Ref CognitoUserPool

  AddUserToTierFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - add-user-to-tier.mjs
    Properties:
      Handler: add-user-to-tier.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              Resource: !GetAtt CognitoUserPool.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
      Events:
        EventBridge:
          Type: EventBridgeRule
          Properties:
            Pattern:
              detail-type:
                - Add User to Tier
              source:
                - user-post-confirmation

  GetLinkedInRedirectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/linkedin-get-redirect.mjs
    Properties:
      Handler: api/linkedin-get-redirect.handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          CALLBACK_URL: !Sub 'https://${PublicApi}.execute-api.${AWS::Region}.amazonaws.com/public/linkedin/redirect'
          CLIENT_ID: !Ref LinkedInClientId
          CLIENT_SECRET: !Ref LinkedInClientSecret
          MOMENTO_API_KEY: !Ref MomentoApiKey
          CACHE_NAME: !Ref CacheName
      Events:
        AuthEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /linkedin/login
            Method: GET

  HandleLinkedInRedirectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/linkedin-handle-redirect.mjs
    Properties:
      Handler: api/linkedin-handle-redirect.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: ssm:PutParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/social-media/*
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
          CLIENT_ID: !Ref LinkedInClientId
          CLIENT_SECRET: !Ref LinkedInClientSecret
          MOMENTO_API_KEY: !Ref MomentoApiKey
          CACHE_NAME: !Ref CacheName
          REDIRECT: !Sub ${Origin}/accounts
      Events:
        AuthEvent:
          Type: Api
          Properties:
            RestApiId: !Ref PublicApi
            Path: /linkedin/redirect
            Method: GET

  SendXPostFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - send-x-post.mjs
    Properties:
      Handler: send-x-post.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/social-media/*

  SendLinkedInPostFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - send-linkedin-post.mjs
    Properties:
      Handler: send-linkedin-post.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/social-media/*

  SendDiscordMessageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - send-discord-message.mjs
    Properties:
      Handler: send-discord-message.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref LinkedInSecrets
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          SECRET_ID: !Ref LinkedInSecrets
          TABLE_NAME: !Ref PostScheduleTable

  GetAccountFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/get-account-detail.mjs
    Properties:
      Handler: api/get-account-detail.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
      Events:
        GetDetailEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /accounts/{accountId}
            Method: GET

  DeleteAccountFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/delete-account.mjs
    Properties:
      Handler: api/delete-account.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt PostScheduleTable.Arn
            - Effect: Allow
              Action: ssm:DeleteParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/social-media/*
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
      Events:
        DeleteAccount:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /accounts/{accountId}
            Method: DELETE

  ListAccountsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/list-accounts.mjs
    Properties:
      Handler: api/list-accounts.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
      Events:
        GetAccountsEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /accounts
            Method: GET

  UpdateAccountFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/update-account.mjs
    Properties:
      Handler: api/update-account.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
      Events:
        UpdateEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /accounts/{accountId}
            Method: PUT

  DeleteSocialCampaignFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - delete-social-campaign.mjs
    Properties:
      Handler: delete-social-campaign.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt PostScheduleTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${PostScheduleTable.Arn}/index/campaigns
            - Effect: Allow
              Action: scheduler:DeleteSchedule
              Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/social/*
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
      Events:
        DeleteEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              detail-type:
                - Delete Social Campaign

  SendUserNotificationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - event-handlers/send-user-notification.mjs
    Properties:
      Handler: event-handlers/send-user-notification.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PostScheduleTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${PostScheduleTable.Arn}/index/schedules
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
          CACHE_NAME: !Ref CacheName
          MOMENTO_API_KEY: !Ref MomentoApiKey
      Events:
        SendEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              detail-type:
                - Send User Notification

  GetUserNotificationsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/get-user-notifications.mjs
    Properties:
      Handler: api/get-user-notifications.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
      Events:
        AuthEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /notifications
            Method: GET

  GetUnreadNotificationsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/get-unread-notifications.mjs
    Properties:
      Handler: api/get-unread-notifications.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${PostScheduleTable.Arn}/index/schedules
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
      Events:
        AuthEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /notifications/unread
            Method: GET

  ReadNotificationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/read-notification.mjs
    Properties:
      Handler: api/read-notification.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
      Events:
        AuthEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /notifications/{notificationId}/read
            Method: POST

  DeleteNotificationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/delete-notification.mjs
    Properties:
      Handler: api/delete-notification.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
      Events:
        AuthEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /notifications/{notificationId}
            Method: DELETE

  PostMessageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/post-message.mjs
    Properties:
      Handler: api/post-message.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt PostScheduleTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
      Events:
        AuthEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /posts
            Method: POST

  SendTestPostFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - send-test-post.mjs
    Properties:
      Handler: send-test-post.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt SendXPostFunction.Arn
                - !GetAtt SendDiscordMessageFunction.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
          SEND_X_POST_ARN: !GetAtt SendXPostFunction.Arn
          SEND_DISCORD_POST_ARN: !GetAtt SendDiscordMessageFunction.Arn
      Events:
        TestEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /accounts/{accountId}/messages
            Method: POST

  GetXRedirectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/x-get-redirect.mjs
    Properties:
      Handler: api/x-get-redirect.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/social-media/*
      Environment:
        Variables:
          CACHE_NAME: !Ref CacheName
          X_CALLBACK_URL: !Sub 'https://${PublicApi}.execute-api.${AWS::Region}.amazonaws.com/public/x/redirect'
          MOMENTO_API_KEY: !Ref MomentoApiKey
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /x/login
            Method: GET

  HandleXRedirectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/x-handle-redirect.mjs
    Properties:
      Handler: api/x-handle-redirect.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/social-media/*
            - Effect: Allow
              Action: ssm:PutParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/social-media/*
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
          CACHE_NAME: !Ref CacheName
          MOMENTO_API_KEY: !Ref MomentoApiKey
          REDIRECT: !Sub ${Origin}/accounts
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref PublicApi
            Path: /x/redirect
            Method: GET

  SaveMessagesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - save-messages.mjs
    Properties:
      Handler: save-messages.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable

  ResumeSchedulingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/resume-scheduling.mjs
    Properties:
      Handler: api/resume-scheduling.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${PostScheduleTable.Arn}/index/campaigns
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
              Resource: !GetAtt PostScheduleTable.Arn
            - Effect: Allow
              Action: states:SendTaskSuccess
              Resource: '*'
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
          HMAC_SECRET: !Ref HmacSecret
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /confirmations/{referenceNumber}
            Method: GET

  ReviewMessagesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - views/review-messages.mjs
    Properties:
      Handler: views/review-messages.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${PostScheduleTable.Arn}/index/campaigns
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
          HMAC_SECRET: !Ref HmacSecret
          BASE_URL: !Ref BaseUrl
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /confirmations/{referenceNumber}/messages
            Method: GET

  UpdateDeleteMessageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - api/update-delete-message.mjs
    Properties:
      Handler: api/update-delete-message.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${PostScheduleTable.Arn}/index/campaigns
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt PostScheduleTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
          HMAC_SECRET: !Ref HmacSecret
      Events:
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /confirmations/{referenceNumber}/messages/{messageId}
            Method: PUT
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /confirmations/{referenceNumber}/messages/{messageId}
            Method: DELETE

  SendReviewEmailFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - send-review-email.mjs
    Properties:
      Handler: send-review-email.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${PostScheduleTable.Arn}/index/campaigns
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PostScheduleTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
      Environment:
        Variables:
          TABLE_NAME: !Ref PostScheduleTable
          HMAC_SECRET: !Ref HmacSecret
          BASE_URL: !Ref BaseUrl
      Events:
        Send:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - scheduler
              detail-type:
                - Send Review Email

  SocialPostScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: social

  TokenExpirationScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: token-expiration

  ScheduleSocialStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: state-machines/schedule-social-post.asl.json
      DefinitionSubstitutions:
        SchedulerCreateSchedule: !Sub arn:${AWS::Partition}:states:::aws-sdk:scheduler:createSchedule
        SchedulerGetSchedule: !Sub arn:${AWS::Partition}:states:::aws-sdk:scheduler:getSchedule
        SchedulerUpdateSchedule: !Sub arn:${AWS::Partition}:states:::aws-sdk:scheduler:updateSchedule
        EventBridgePutEvents: !Sub arn:${AWS::Partition}:states:::events:putEvents
        SchedulerRole: !GetAtt SendSocialPostSchedulerRole.Arn
        SendSocialPostStateMachine: !Ref SendSocialStateMachine
        DeadLetterQueue: !GetAtt SocialPostDLQ.Arn
        TableName: !Ref PostScheduleTable
        DynamoDbQuery: !Sub arn:${AWS::Partition}:states:::aws-sdk:dynamodb:query
        DynamoDbPutItem: !Sub arn:${AWS::Partition}:states:::dynamodb:putItem
        DynamoDbGetItem: !Sub arn:${AWS::Partition}:states:::dynamodb:getItem
        DynamoDbUpdateItem: !Sub arn:${AWS::Partition}:states:::dynamodb:updateItem
        UnmarshallDataFunction: "{{resolve:ssm:/serverless-toolbox/marshall-unmarshall-data}}"
        CalculateScheduleFunction: !GetAtt CalculateScheduledTimeFunction.Arn
        LambdaInvoke: !Sub arn:${AWS::Partition}:states:::lambda:invoke
        SaveMessages: !GetAtt SaveMessagesFunction.Arn
        EventBridgePutEventsAndWait: !Sub arn:${AWS::Partition}:states:::events:putEvents.waitForTaskToken
        StepFunctionsStartExecution: !Sub arn:${AWS::Partition}:states:::states:startExecution
      Policies:
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:GetSchedule
                - scheduler:UpdateSchedule
              Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/social/*
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SendSocialPostSchedulerRole.Arn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - "{{resolve:ssm:/serverless-toolbox/marshall-unmarshall-data}}"
                - !GetAtt CalculateScheduledTimeFunction.Arn
                - !GetAtt SaveMessagesFunction.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PostScheduleTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${PostScheduleTable.Arn}/index/schedules
            - Effect: Allow
              Action: states:StartExecution
              Resource: !GetAtt SendSocialStateMachine.Arn
      Events:
        ScheduledSocialPostEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              detail-type:
                - Schedule Social Post

  SendSocialStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: state-machines/send-social-post.asl.json
      DefinitionSubstitutions:
        LambdaInvoke: !Sub arn:${AWS::Partition}:states:::lambda:invoke
        SendXPost: !GetAtt SendXPostFunction.Arn
        SendLinkedInPost: !GetAtt SendLinkedInPostFunction.Arn
        SendDiscordMessage: !GetAtt SendDiscordMessageFunction.Arn
        EventBridgePutEvents: !Sub arn:${AWS::Partition}:states:::events:putEvents
        DynamoDbGetItem: !Sub arn:${AWS::Partition}:states:::dynamodb:getItem
        DynamoDbUpdateItem: !Sub arn:${AWS::Partition}:states:::dynamodb:updateItem
        UnmarshallDataFunction: "{{resolve:ssm:/serverless-toolbox/marshall-unmarshall-data}}"
        TableName: !Ref PostScheduleTable
      Policies:
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt SendXPostFunction.Arn
                - !GetAtt SendLinkedInPostFunction.Arn
                - !GetAtt SendDiscordMessageFunction.Arn
                - "{{resolve:ssm:/serverless-toolbox/marshall-unmarshall-data}}"
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PostScheduleTable.Arn

  SendSocialPostSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendSocialPostSchedulerPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !GetAtt SendSocialStateMachine.Arn

  SocialPostDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  DLQAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: SocialPostAlarm

  DLQAgeAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: SocialPostAlarm
      AlarmDescription: Alarm if failed social post messages stay in DLQ for more than 1 hour
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3600
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref DLQAlarmTopic
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SocialPostDLQ.QueueName

  CalculateScheduledTimeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - calculate-scheduled-time.mjs
    Properties:
      Handler: calculate-scheduled-time.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action: 'bedrock:InvokeModel'
              Resource: '*'

Outputs:
  ApiBaseUrl:
    Description: API Gateway endpoint for the account API
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/v1'
  PublicApiUrl:
    Description: API Gateway endpoint for the public API for 3-legged auth
    Value: !Sub 'https://${PublicApi}.execute-api.${AWS::Region}.amazonaws.com/public'
  UserPoolClientId:
    Description: Id of user pool client
    Value: !Ref CognitoUserPoolClient
  IdentityPoolId:
    Description: Id of the identity pool
    Value: !Ref CognitoIdentityPool
  UserPoolId:
    Description: Id of the user pool
    Value: !Ref CognitoUserPool
