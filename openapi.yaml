openapi: 3.0.0
info:
  title: Social Media Configuration
  description: Adds, updates, and lists social media accounts
  version: 1.0.0
tags:
  - name: Account
    description: |
      Operations to manage maintenance of a social media account
  - name: Auth
    description: Operations to handle authN and authZ
  - name: Schedule
    description: Operations to manage scheduling posts

x-amazon-apigateway-request-validators:
  Validate All:
    validateRequestParameters: true
    validateRequestBody: true
x-amazon-apigateway-gateway-responses:
  BAD_REQUEST_BODY:
    statusCode: 400
    responseTemplates:
      application/json: '{ "message": "$context.error.validationErrorString" }'

x-amazon-apigateway-cors:
  allowOrigins:
    - '*'
  allowMethods:
    - GET
    - POST
    - PUT
  allowHeaders:
    - authorization
    - content-type
  maxAge: 3600

paths:
  /accounts:
    get:
      summary: List accounts
      description: Returns a page that lists accounts for a user
      tags:
        - Account
      responses:
        200:
          description: The request succeeded and the accounts are listed
          content:
            text/html:
              schema:
                type: string
        403:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListAccountsFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/accountId'
    get:
      summary: Get account details
      description: Returns a form for account configuration
      tags:
        - Account
      responses:
        200:
          $ref: '#/components/schemas/AccountDetail'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetAccountFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    put:
      summary: Update account information
      description: Replaces the account name
      tags:
        - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
        required: true
      responses:
        204:
          $ref: '#/components/responses/NoContent'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateAccountFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    delete:
      summary: Delete an account
      description: Remove an account and delete all scheduled messages
      tags:
        - Account
      responses:
        204:
          $ref: '#/components/responses/NoContent'
        403:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteAccountFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /posts:
    post:
      summary: Send a post
      description: Sends a post to the specified accounts
      tags:
        - Posts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessage'
      responses:
        202:
          description: The request succeeded and the messages are being processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        403:
          $ref: '#/components/responses/Unauthorized'
        400:
          $ref: '#/components/responses/ClientError'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PostMessageFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /notifications:
    get:
      summary: Gets all notifications for a user
      description: Returns a list of notifications
      tags:
        - Notifications
      responses:
        200:
          description: User notifications have been returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
        403:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUserNotificationsFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /notifications/{notificationId}:
    parameters:
      - $ref: '#/components/parameters/notificationId'
    delete:
      summary: Delete a notification
      description: Removes a notification from the user's list
      tags:
        - Notifications
      responses:
        204:
          $ref: '#/components/responses/NoContent'
        403:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteNotificationFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/notificationId'
    post:
      summary: Read a notification
      description: Mark a notification as read and optionally follow the backing link
      tags:
        - Notifications
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                follow:
                  type: boolean
              required:
                - follow
      responses:
        200:
          description: The request succeeded and a url is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectUrl:
                    type: string
        204:
          $ref: '#/components/responses/NoContent'
        400:
          $ref: '#/components/responses/ClientError'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReadNotificationFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /notifications/unread:
    get:
      summary: Gets unread notification count
      description: Returns a number value for unread notifications
      tags:
        - Notifications
      responses:
        200:
          description: Unread notification count is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                required:
                  - count
        403:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUnreadNotificationsFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /accounts/{accountId}/messages:
    parameters:
      - $ref: '#/components/parameters/accountId'
    post:
      summary: Send a message
      description: Sends a message to the specified account
      tags:
        - Account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 1
                platform:
                  type: string
                  enum: [x, linkedIn, discord]
              required:
                - message
                - platform
      responses:
        201:
          description: The request succeeded and the message was sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        400:
          $ref: '#/components/responses/ClientError'
        403:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SendTestPostFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /linkedin/login:
    get:
      summary: Authenticate integration with LinkedIn
      description: Go through 3-legged OAuth flow to authenticate with LinkedIn
      parameters:
        - name: name
          in: query
          description: Name of the account
          required: false
          schema:
            type: string
      tags:
        - Auth
      responses:
        200:
          description: The request succeeded and an auth url is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  loginUrl:
                    type: string
        403:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetLinkedInRedirectFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /x/login:
    get:
      summary: Authenticate integration with X
      description: Go through 3-legged OAuth flow to authenticate with X
      parameters:
        - name: name
          in: query
          description: Name of the account
          required: false
          schema:
            type: string
      tags:
        - Auth
      responses:
        200:
          description: The request succeeded and an auth url is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  loginUrl:
                    type: string
        403:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetXRedirectFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /confirmations/{referenceNumber}:
    parameters:
      - $ref: '#/components/parameters/referenceNumber'
      - $ref: '#/components/parameters/token'
    get:
      summary: Resumes scheduling posts
      description: For posts going through a verification flow, resumes the process after human validation
      tags:
        - Schedule
      responses:
        200:
          description: The request succeeded and an auth url is returned
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ResumeSchedulingFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /confirmations/{referenceNumber}/messages:
    parameters:
      - $ref: '#/components/parameters/referenceNumber'
      - $ref: '#/components/parameters/token'
    get:
      summary: Review messages
      description: Verify message content before sending
      tags:
        - Schedule
      responses:
        200:
          description: The request succeeded and the item is included in the response.
          content:
            text/html:
              schema:
                type: string
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReviewMessagesFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /confirmations/{referenceNumber}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/referenceNumber'
      - $ref: '#/components/parameters/token'
      - name: messageId
        in: path
        description: Identifier for a message
        required: true
        example: kdsfgjlksdfg-0
        schema:
          type: string
    put:
      summary: Update message
      description: Update information about a message
      tags:
        - Schedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 1
              required:
                - message
      responses:
        204:
          $ref: '#/components/responses/NoContent'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateDeleteMessageFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    delete:
      summary: Delete a message
      description: Deletes a proposed message to be sent
      tags:
        - Messages
      responses:
        204:
          $ref: '#/components/responses/NoContent'
        500:
          $ref: '#/components/responses/InternalServerError'
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateDeleteMessageFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

components:
  parameters:
    accountId:
      name: accountId
      in: path
      description: Identifier for an account
      required: true
      example: 09sl3415098gplmn
      schema:
        type: string

    notificationId:
      name: notificationId
      in: path
      description: Identifier for a notification
      required: true
      example: ja93j567dfgks7
      schema:
        type: string

    referenceNumber:
      name: referenceNumber
      in: path
      description: Identifier for a scheduling batch
      required: true
      example: argkasdfguaksdfna
      schema:
        type: string

    token:
      name: token
      in: query
      description: Temporary auth token
      required: true
      example: kfrkjkjbnmfk
      schema:
        type: string

  schemas:
    AccountMetadata:
      type: object
      required:
        - name
        - id
      properties:
        name:
          type: string
        id:
          type: string

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    AccountDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        screenName:
          type: string
        platform:
          type: string
          enum: [x, linkedin, discord]
        createdDate:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
      required:
        - id
        - name
        - screenName
        - platform
        - createdDate

    PostMessage:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: string
        message:
          type: object
          properties:
            text:
              type: string
            media:
              type: array
              items:
                type: object
                properties:
                  mimeType:
                    type: string
                  url:
                    type: string
                required:
                  - mimeType
                  - url
          required:
            - text
        sendAt:
          type: string
          description: ISO8601 date, "now", or "auto"
      required:
        - accounts
        - message
        - sendAt

    Notification:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        date:
          type: string
          format: date-time
        isUnread:
          type: boolean
        link:
          type: string
      required:
        - id
        - message
        - date
        - isUnread

  responses:
    Created: #201
      description: The request succeeded and created a new account
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
            required:
              - id
    NoContent: #204
      description: The request succeeded and nothing was returned
    Unauthorized: #403
      description: The request was not authorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: The provided token is not valid
            required:
              - message
    ClientError: #400
      description: The request was in an invalid format
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Could not perform operation with provided data
            required:
              - message
    NotFound: #404
      description: The requested item was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Could not find an account with the specified id.
            required:
              - message
    Conflict: #409
      description: The requested item was not in the proper state
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: The provided platform is not configured
            required:
              - message
    InternalServerError: #500
      description: The server encountered an unexpected condition which prevented it from fulfilling the request.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: An error occurred saving the item.
            required:
              - message
